      <header class="hero">
        <p class="eyebrow">給零基礎同仁的網頁入門課</p>
        <h1>AI Web 開發入門</h1>
        <p class="lead">不用先當工程師。先花幾個小時搞懂網頁是怎麼組成的，再跟 AI 一起做出抽籤、報名表、待辦清單這些真的用得到的小工具。</p>
        <a class="btn-primary" href="./basics/01-what-is-web.html">從第 1 章開始 →</a>
      </header>

      <section class="goals">
        <h2>這門課怎麼上</h2>
        <ul>
          <li><strong>先打底</strong>：8 章網頁基礎，每章 30–100 分鐘，全程只做同一個作品「我的自我介紹頁」，一章加一點。</li>
          <li><strong>再實戰</strong>：4 個小範例，每個都只有一個檔案，做完就能傳給同事用。</li>
          <li><strong>跟 AI 合作</strong>：每章都有「跟 AI 一起做」，教你怎麼問、怎麼看懂、怎麼判斷 AI 給的程式碼對不對。</li>
          <li><strong>不用安裝一堆東西</strong>：只需要瀏覽器和一個文字編輯器。</li>
        </ul>
      </section>

      <div id="progress"></div>
      <div id="roadmap"></div>
